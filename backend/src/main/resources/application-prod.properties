# Production Configuration for Render
spring.application.name=e-learning-platform

# H2 Database for Demo (works in production)
spring.datasource.url=jdbc:h2:mem:demo_db
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=false

# JPA Configuration
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# JWT Configuration
app.jwt.secret=44c535c83d6e19f9cd1035a76c2b31c4
app.jwt.expiration-ms=86400000

# Demo Mode
demo.mode=true
demo.email.enabled=false
demo.storage.base-url=https://picsum.photos

# Server Configuration for Render
server.port=${PORT:8080}

# CORS Configuration (will be updated after frontend deployment)
spring.web.cors.allowed-origins=https://your-frontend-name.vercel.app,https://*.vercel.app,https://*.netlify.app,http://localhost:5173,http://localhost:5174
spring.web.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
spring.web.cors.allowed-headers=*
spring.web.cors.allow-credentials=true

# Frontend URL (will be updated after frontend deployment)
app.frontend-url=https://your-frontend-name.vercel.app

# File upload limits
spring.servlet.multipart.max-file-size=15MB
spring.servlet.multipart.max-request-size=130MB

# Logging for production
logging.level.com.mycourse.elearningplatform=INFO
logging.level.org.springframework.web=INFO